tools:
- name: capabilities
  execution: sync
  affinity: any
  enforce_thread_affinity: false
  job_strategy: monolithic
  annotations:
    read_only_hint: true
    idempotent_hint: true
  description: >-
    Print the graded capability report for the Excel adapter: which
    capabilities are verified by CI on a headless runner, which require
    desktop Excel (host_limited), and which are unimplemented. Use before
    promising an Excel capability to a user.
  input_schema:
    type: object
    properties: {}
  call_examples:
  - arguments: {}
    note: List every Excel capability with its grade and the evidence behind it
- name: preflight
  execution: sync
  affinity: any
  enforce_thread_affinity: false
  job_strategy: monolithic
  annotations:
    read_only_hint: true
    idempotent_hint: true
  description: >-
    Start-up self-check: report whether the headless Open XML backend and the
    desktop Excel COM backend are available on this machine, which capabilities
    degrade without Excel, and the supported host matrix. Never fails simply
    because desktop Excel is absent.
  input_schema:
    type: object
    properties: {}
  call_examples:
  - arguments: {}
    note: Check what this machine can actually do before an Excel run
