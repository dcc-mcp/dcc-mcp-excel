name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    # Headless by design: the xlsx compile + read-back gate must prove it does
    # NOT depend on a desktop Excel installation, so it runs on Linux.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest -q

  packaging:
    # Windows-only: dcc-mcp-cli ships as a Windows binary through the
    # dcc-mcp-core release train (not pip), and there is no Linux build to
    # fall back on. The headless gate above already covers the Office-free
    # path, so Windows here adds coverage rather than gating on it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: CLI smoke (version + preflight must work on a clean install)
        shell: pwsh
        run: |
          python -m dcc_mcp_excel._standalone_entry --version
          python -m dcc_mcp_excel._standalone_entry preflight
      - name: Skill lint (official dcc-mcp-cli validator)
        shell: pwsh
        run: |
          # dcc-mcp-cli ships through the dcc-mcp-core release train, not pip.
          Invoke-WebRequest -Uri "https://github.com/dcc-mcp/dcc-mcp-core/releases/download/v0.20.6/dcc-mcp-cli-windows-x86_64.exe" -OutFile "$env:RUNNER_TEMP\dcc-mcp-cli.exe"
          & "$env:RUNNER_TEMP\dcc-mcp-cli.exe" lint src/dcc_mcp_excel/skills --warnings-as-errors --non-interactive
