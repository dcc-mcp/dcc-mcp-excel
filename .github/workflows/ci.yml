name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    # Headless by design: the xlsx compile + read-back gate must prove it does
    # NOT depend on a desktop Excel installation, so it runs on Linux.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest -q

  skill-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Skill lint (official dcc-mcp-cli validator)
        run: |
          # dcc-mcp-cli ships through the dcc-mcp-core release train, not pip.
          # The Windows build is used because no Linux CLI build is published.
          curl -fsSL -o "$RUNNER_TEMP/dcc-mcp-cli.exe" \
            "https://github.com/dcc-mcp/dcc-mcp-core/releases/download/v0.20.6/dcc-mcp-cli-windows-x86_64.exe"
          # wine is preinstalled on ubuntu-latest runners.
          wine "$RUNNER_TEMP/dcc-mcp-cli.exe" lint src/dcc_mcp_excel/skills --warnings-as-errors --non-interactive

  packaging:
    # Windows-only: the standalone PyOxidizer bundle targets the Office/COM
    # domain. The headless gate above already covers the Office-free path.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: CLI smoke (compile via the shared host is not wired; version + preflight must work)
        shell: pwsh
        run: |
          python -m dcc_mcp_excel._standalone_entry --version
          python -m dcc_mcp_excel._standalone_entry preflight
