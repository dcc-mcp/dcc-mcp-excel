name: Release

# Automated releases via release-please (conventional commits), mirroring
# dcc-mcp-office's release flow.
#
# Every push to main runs release-please, which keeps a release PR up to date.
# When that PR is merged, release-please creates the GitHub release and tag;
# this workflow publishes the wheel to PyPI from that exact tag after
# verifying the tag, the manifest and pyproject.toml agree on one version.
#
# No standalone binary job on purpose: dcc-mcp-excel is a headless,
# Office-free adapter (ADR 004) and ships the same wheel to every platform.
# The PyOxidizer bundle in dcc-mcp-powerpoint exists to carry the Windows-only
# C# COM host; nothing here needs it.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A PAT (user-owned) is required: PRs opened with the default
          # GITHUB_TOKEN do not trigger pull_request workflows, so CI would
          # never run on release PRs.
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/dcc-mcp-excel
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release identity and version
        env:
          EXPECTED_VERSION: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release target must be a canonical vMAJOR.MINOR.PATCH tag." >&2
            exit 1
          }
          export EXPECTED_VERSION="${RELEASE_TAG#v}"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected = os.environ["EXPECTED_VERSION"]
          manifest = json.loads(Path(".release-please-manifest.json").read_text(encoding="utf-8"))["."]
          source = Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'^version = "([0-9]+\.[0-9]+\.[0-9]+)"', source, re.MULTILINE)
          if match is None or manifest != expected or match.group(1) != expected:
              raise SystemExit("Checked-out package version does not match the release target.")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true
          print-hash: true
